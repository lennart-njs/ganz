<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../../styles.css">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js"></script>
<script src="../../_ds_bundle.js" onerror="this.remove()"></script>
<script src="../../ganz-loader.js"></script>
</head><body style="margin:0;padding:24px;background:var(--bg-page);font-family:var(--font-sans);color:var(--text-strong)"><div id="r"></div>
<script type="text/babel">
ganzReady.then((NS) => {
const { AppHeader, BottomBar, ChatBubble, StepProgress, Toast, StarRating, Button } = NS;
function D() {
  const [r, setR] = React.useState(4);
  return <div style={{ display: 'grid', gridTemplateColumns: '1fr 1fr', gap: 16 }}>
    <div style={{ background: 'var(--bg-page)', border: '1px solid var(--border-default)', borderRadius: 14, overflow: 'hidden', display: 'flex', flexDirection: 'column' }}>
      <AppHeader title="Rückfragen" onBack={() => {}} />
      <div style={{ padding: '8px 16px 16px', display: 'flex', flexDirection: 'column', gap: 10 }}>
        <ChatBubble from="user" note="Foto vom Sieb angehängt">Spülmaschine pumpt nicht ab.</ChatBubble>
        <ChatBubble>Hörst du ein Brummen, wenn die Maschine abpumpen soll?</ChatBubble>
      </div>
      <BottomBar style={{ paddingBottom: 16 }}><Button size="lg" fullWidth>Ergebnis ansehen</Button></BottomBar>
    </div>
    <div style={{ display: 'flex', flexDirection: 'column', gap: 18 }}>
      <div><StepProgress total={6} current={1} /><div style={{ marginTop: 10, fontSize: 14, color: 'var(--text-muted)' }}>Schritt 2 von 6</div></div>
      <Toast>Bitte zuerst den Stecker ziehen und bestätigen.</Toast>
      <StarRating value={r} onChange={setR} />
    </div>
  </div>;
}
ReactDOM.createRoot(document.getElementById('r')).render(<D />);
});
</script></body></html>
