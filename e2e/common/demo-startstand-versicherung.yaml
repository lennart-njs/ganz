# Teil-Flow für die Flows mit Versicherung: frisch starten, Onboarding überspringen,
# „Demo-Startstand Versicherung“ laden. Danach steht die App auf der Startseite: Schutz verknüpft,
# Waschmaschine aus dem Vertrag, kein Händler, kein Fall. Wie die monatlichen Prüfungen mit
# Versicherung in docs/PITCH_CHECK.md.
#
# Onboarding wie in Entscheidung 31: Zuerst kommt das Gerät, „Später hinzufügen“ überspringt es
# und damit auch Händler und Versicherung.
#
# Nicht gelaufen: Es gibt hier weder Simulator noch Maestro.
# __tests__/build/e2eFlows.test.ts prüft die Selektoren gegen i18n/de.ts und den Code.
appId: io.machs.app.pitch
---
# Ohne Kamera und ohne Mitteilungen: Die App bietet dann das Beispielfoto an, und vor
# „Termin anfragen“ kommt kein Systemdialog.
- launchApp:
    clearState: true
    permissions:
      camera: deny
      notifications: deny
- tapOn: 'Los geht’s'
- tapOn: 'Später hinzufügen'
- tapOn: 'Profil.*'
- scrollUntilVisible:
    element:
      text: 'Version .*'
# Sieben Taps innerhalb von 3 Sekunden öffnen die Demo-Steuerung
- tapOn:
    text: 'Version .*'
    repeat: 7
    delay: 100
- scrollUntilVisible:
    element:
      text: 'Demo-Startstand Versicherung'
- tapOn: 'Demo-Startstand Versicherung'
- assertVisible: "Was ist kaputt\\?.*"
